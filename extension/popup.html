<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>강의 한국어 더빙</title>
<style>
body{font:14px system-ui,sans-serif;width:270px;padding:12px;color:#182634}
h1{font-size:19px}label{display:block;margin:16px 0}input,select{margin-top:6px;width:100%}
button{font:inherit;padding:7px 14px;border:1px solid #aab5bf;border-radius:6px;background:white}
#toggle{background:#184e46;color:white}#toggle[aria-pressed="true"]{background:#702f27}output{display:block;margin-top:12px;line-height:1.5}
</style>
<h1>강의 한국어 더빙</h1>
<p>유튜브에서 원본 언어 자막(CC)을 켜세요.</p>
<label>더빙 목소리<select id="voice"><option value="">한국어 음성 자동 선택</option></select></label>
<details><summary>Gemini API 설정</summary>
<p>결제가 연결되지 않은 무료 등급 프로젝트의 키를 사용하세요. 유료 프로젝트 키는 과금될 수 있습니다. 번역된 문장을 Google로 전송합니다.</p>
<p><a href="https://aistudio.google.com/api-keys" target="_blank" rel="noreferrer">API 키 만들기</a> · <a href="https://aistudio.google.com/rate-limit" target="_blank" rel="noreferrer">무료 사용 한도 확인</a></p>
<label>API 키<input id="gemini-key" type="password" autocomplete="off" placeholder="새 키 입력 (저장 후 비워집니다)"></label>
<button id="save-key">키 저장</button> <button id="delete-key">키 삭제</button>
<output id="key-status" aria-live="polite"></output>
<p>키는 이 Chrome 프로필에만 저장됩니다. 동기화하지 않습니다.</p>
</details>
<button id="preview">목소리 미리듣기</button>
<button id="preview-stop">미리듣기 중지</button>
<output id="preview-status" aria-live="polite">로컬 음성은 첫 사용 시 약 400MB를 다운로드합니다.</output>
<label>말하기 속도<select id="rate">
<option value="0.75">천천히 · 0.75배</option>
<option value="0.9" selected>조금 천천히 · 0.9배</option>
<option value="1">보통 · 1배</option>
<option value="1.1">조금 빠르게 · 1.1배</option>
</select></label>
<label>번역 스타일<select id="style">
<option value="lecture">표준 강의체</option>
<option value="friendly">친근한 설명체</option>
<option value="concise">간결한 기술 해설</option>
</select></label>
<label>자막 파일로 대체 (선택)<input id="file" type="file" accept=".vtt,.srt"></label>
<button id="toggle" aria-pressed="false" disabled>더빙 켜기</button>
<output id="status" aria-live="polite"></output>
<script src="popup.js"></script></html>
