<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>강의 한국어 더빙</title>
<style>
body{font:14px system-ui,sans-serif;width:320px;padding:12px;color:#182634}
h1{font-size:19px}label{display:block;margin:16px 0}input,select{margin-top:6px;width:100%}
button{font:inherit;padding:7px 14px;border:1px solid #aab5bf;border-radius:6px;background:white}
#toggle{background:#184e46;color:white}#toggle[aria-pressed="true"]{background:#702f27}output{display:block;margin-top:12px;line-height:1.5}
</style>
<h1>강의 한국어 더빙</h1>
<p>자막을 가져온 뒤 CC는 끄고 한국어로 읽습니다. 종료하면 이전 CC 상태로 복원합니다.</p>
<p>제공되는 자동 생성 자막도 사용합니다. 자막이 없는 영상에서는 자동 생성을 요청할 수 없습니다.</p>
<label>번역 실행 위치<select id="translation-mode"><option value="local">내 PC의 Codex</option><option value="office">사무실 Codex</option></select></label>
<div id="office-panel" hidden>
<p id="account-status">허용된 계정으로 로그인해 주세요.</p>
<form id="login-form">
<label>이메일<input id="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label>
<button id="login" type="submit">로그인</button>
</form>
<button id="logout" hidden>로그아웃</button>
<output id="login-status" aria-live="polite"></output>
<p>자막을 사무실 서버로 보내 번역합니다. 상대방 PC에는 Codex 설치가 필요 없습니다.</p>
</div>
<details><summary>로컬·사무실 번역 속도 비교</summary><p>두 모드가 모두 준비되어야 합니다. 같은 자막을 각 3회 번역하며 Codex 사용량이 발생합니다.</p><button id="compare">속도 비교 시작</button><output id="benchmark-status" aria-live="polite"></output></details>
<label>자막 파일로 대체 (선택)<input id="file" type="file" accept=".vtt,.srt"></label>
<button id="toggle" aria-pressed="false" disabled>더빙 켜기</button>
<output id="status" aria-live="polite"></output>
<script src="remote-config.js"></script><script src="popup.js"></script></html>
