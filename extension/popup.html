<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>kodubber</title>
<style>
[hidden]{display:none!important}
.speed-labels{display:flex;justify-content:space-between;font-size:12px}#speech-rate{accent-color:#184e46;cursor:pointer}
body{font:14px system-ui,sans-serif;width:320px;padding:12px;color:#182634}
h1{font-size:19px}label{display:block;margin:16px 0}input,select{margin-top:6px;width:100%}
button{font:inherit;padding:7px 14px;border:1px solid #aab5bf;border-radius:6px;background:white}
#toggle{background:#184e46;color:white}#toggle[aria-pressed="true"]{background:#702f27}output{display:block;margin-top:12px;line-height:1.5}
</style>
<h1>kodubber</h1>
<p>일반·자동 생성 자막을 한국어로 읽습니다.</p>
<label>번역 엔진<select id="translation-provider" disabled></select></label>
<p id="provider-note" hidden>연결된 CLI가 없습니다. Chrome 번역을 선택할 수 있습니다.</p>
<label id="voice-picker" hidden>한국어 음성<select id="voice"></select></label>
<p id="voice-note" hidden></p>
<label>음성 속도<input id="speech-rate" type="range" min="0" max="4" step="1" value="2" aria-valuetext="0, 기본" aria-describedby="speed-help" disabled><span class="speed-labels" aria-hidden="true"><span>-2</span><span>-1</span><span>0</span><span>1</span><span>2</span></span></label>
<p id="speed-help">더빙이 먼저 끝나 기다리면 느린 쪽으로, 더빙이 늦어 영상이 멈추면 빠른 쪽으로 조절하세요.</p>
<button id="toggle" aria-pressed="false" disabled>더빙 켜기</button>
<output id="status" aria-live="polite"></output>
<script src="preferences.js"></script>
<script src="popup.js"></script></html>
